name: Publish to NPM and GitHub Releases

on:
  push:
    branches: [ main ]
  # Also dispatched by CI after an automated API update is auto-merged
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[run publish]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing: GitHub proves the workflow's identity to npm (OIDC),
      # so no NPM_TOKEN is needed and nothing expires. Configured on npmjs.com under
      # torn-client > Settings > Trusted Publisher (repo neon0404/torn-client, workflow publish.yml)
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Extract version from package.json
        id: get_version
        run: echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      # Makes the workflow safe to re-run or dispatch twice: an existing version is never republished
      - name: Check whether this version is already published
        id: published
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(jq -r .name package.json)
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm, skipping publish" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.published.outputs.npm != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.published.outputs.npm != 'true'
        run: pnpm build

      # Trusted publishing needs npm CLI >= 11.5.1
      - name: Ensure npm supports trusted publishing
        if: steps.published.outputs.npm != 'true'
        run: |
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"; then
            npm install -g npm@latest
          fi
          echo "npm $(npm --version)"

      # npm (not pnpm) handles the OIDC exchange; it still runs prepublishOnly
      # (lint, tests, build) through pnpm, and adds provenance automatically
      - name: Publish to NPM
        if: steps.published.outputs.npm != 'true'
        run: npm publish --access public

      - name: Create GitHub Release
        id: create_release
        if: steps.published.outputs.release != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.VERSION }}"
          name: "Release v${{ steps.get_version.outputs.VERSION }}"
          generate_release_notes: true